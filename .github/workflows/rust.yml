name: Rust

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        args:
          - ""
          - "--no-default-features"
          - "--no-default-features --features de"
          - "--no-default-features --features parallel"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked ${{ matrix.args }}
      - run: cargo clippy --all-targets --locked ${{ matrix.args }} -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked ${{ matrix.args }}

  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        args: ["", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.0
      - run: cargo test --locked ${{ matrix.args }}
